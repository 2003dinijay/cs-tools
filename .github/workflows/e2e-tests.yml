# Customer Portal — Playwright E2E.
#
# The suite signs itself in: the `auth` setup project performs a real
# username/password/TOTP login and writes the session every spec replays, so no
# session file needs provisioning here. It needs the credentials below as
# secrets; without them the sign-in skips, every spec skips, and the job would
# report a green tick meaning "nothing ran" — the guard step turns that into a
# failure instead.
#
# ⚠️ These specs run against a REAL deployed backend. Creation specs write
# records that cannot be deleted, so they are gated behind
# E2E_ALLOW_PERMANENT_WRITES and stay OFF here. A scheduled or per-PR run must
# not accumulate permanent customer-visible data.

name: Customer Portal E2E Tests

# Manual only.
#
# The push and pull_request triggers are deliberately absent: these specs run
# against a REAL deployed environment under a single shared account, so every
# run competes with anyone else testing and some of it writes records that
# cannot be deleted. Firing on every push to a 300-test suite that signs in for
# real would also rate-limit the IdP.
#
# Re-enable them only once the suite has a disposable environment of its own.
on:
  workflow_dispatch:


env:
  TZ: Asia/Kolkata 

# One run at a time: the suite shares a single account against a live backend,
# so two concurrent runs interfere with each other. Queued rather than
# cancelled — a manual run is deliberate, and killing someone's half-finished
# run mid-way can leave the AI assistant toggled on for everyone else.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    # package.json, pnpm-lock.yaml and playwright.config.ts all live here — the
    # specs under tests/e2e are not a separate package.
    working-directory: apps/customer-portal/webapp

jobs:
  test:
    name: E2E (chromium)
    timeout-minutes: 240
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: "pnpm"
          cache-dependency-path: apps/customer-portal/webapp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          
      - name: Report clock skew vs target
        continue-on-error: true
        env:
          # Declared here too: env set on the test step is not visible to this
          # one, so without it `curl "$E2E_BASE_URL"` runs against an empty URL.
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL != '' && vars.E2E_BASE_URL || 'http://localhost:3000' }}
        run: |
          echo "Runner UTC : $(date -u)"
          echo "Runner $TZ : $(date)"
          remote=$(curl -sSI --max-time 20 "$E2E_BASE_URL" | grep -i '^date:' | cut -d' ' -f2-)
          echo "Target Date header: ${remote:-<none>}"
          if [ -n "$remote" ]; then
            skew=$(( $(date -u -d "$remote" +%s) - $(date -u +%s) ))
            echo "Skew: ${skew}s (runner is behind by this many seconds)"
          fi

      - name: Run E2E tests
        env:
          # Target environment, from a repo/environment VARIABLE — it is not a
          # credential, and keeping it visible means a failing run shows which
          # deployment it ran against. The minted session is scoped to this
          # origin, so it must match the deployment the credentials belong to.
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL != '' && vars.E2E_BASE_URL || 'http://localhost:3000' }}
          # Skip booting the local vite dev server — CI runs against a deployed
          # environment. Set the repo VARIABLE to an empty string to have
          # Playwright start `pnpm run dev` itself.
          E2E_NO_WEBSERVER: ${{ vars.E2E_NO_WEBSERVER != '' && vars.E2E_NO_WEBSERVER || '1' }}
          # "admin" (default) or "portal" — see tests/e2e/auth/credentials.ts.
          E2E_LOGIN_IDENTITY: ${{ vars.E2E_LOGIN_IDENTITY != '' && vars.E2E_LOGIN_IDENTITY || 'admin' }}
          # The account to sign in as. A variable, not a secret: it identifies
          # which account ran rather than granting access, and the suite already
          # prints it on every run (describeCredentials) — masking it would only
          # hide which account a failure belongs to.
          E2E_USERNAME: ${{ vars.E2E_USERNAME }}
          # Real staging password and TOTP seed: masked secrets only, never vars.
          # When these are unset the auth setup project skips and the specs skip
          # with it, rather than failing.
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
          # Only needed when E2E_LOGIN_IDENTITY is "portal".
          E2E_PORTAL_USERNAME: ${{ secrets.E2E_PORTAL_USERNAME }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
          E2E_PORTAL_TOTP_SECRET: ${{ secrets.E2E_PORTAL_TOTP_SECRET }}
          # ── The 3x4 identity matrix, used by the RBAC specs ─────────────
          #
          # Addressed as E2E_<PROJECT>_<ROLE>_* by readRoleCredentials() in
          # tests/e2e/auth/credentials.ts. Usernames are VARIABLES (identifiers,
          # and the specs log them so a failure names the account); passwords and
          # TOTP seeds are SECRETS.
          #
          # Any pair that is unset simply skips its tests — hasRoleCredentials()
          # gates on all three being present, so a partially configured matrix
          # reports which combination is missing rather than failing obscurely.
          #
          # Subscription
          E2E_SUB_ADMIN_USERNAME: ${{ vars.E2E_SUB_ADMIN_USERNAME }}
          E2E_SUB_ADMIN_PASSWORD: ${{ secrets.E2E_SUB_ADMIN_PASSWORD }}
          E2E_SUB_ADMIN_TOTP_SECRET: ${{ secrets.E2E_SUB_ADMIN_TOTP_SECRET }}
          E2E_SUB_PORTAL_USERNAME: ${{ vars.E2E_SUB_PORTAL_USERNAME }}
          E2E_SUB_PORTAL_PASSWORD: ${{ secrets.E2E_SUB_PORTAL_PASSWORD }}
          E2E_SUB_PORTAL_TOTP_SECRET: ${{ secrets.E2E_SUB_PORTAL_TOTP_SECRET }}
          E2E_SUB_SECURITY_USERNAME: ${{ vars.E2E_SUB_SECURITY_USERNAME }}
          E2E_SUB_SECURITY_PASSWORD: ${{ secrets.E2E_SUB_SECURITY_PASSWORD }}
          E2E_SUB_SECURITY_TOTP_SECRET: ${{ secrets.E2E_SUB_SECURITY_TOTP_SECRET }}
          E2E_SUB_LEAD_USERNAME: ${{ vars.E2E_SUB_LEAD_USERNAME }}
          E2E_SUB_LEAD_PASSWORD: ${{ secrets.E2E_SUB_LEAD_PASSWORD }}
          E2E_SUB_LEAD_TOTP_SECRET: ${{ secrets.E2E_SUB_LEAD_TOTP_SECRET }}
          #
          # Managed Cloud Subscription
          E2E_MS_SUB_ADMIN_USERNAME: ${{ vars.E2E_MS_SUB_ADMIN_USERNAME }}
          E2E_MS_SUB_ADMIN_PASSWORD: ${{ secrets.E2E_MS_SUB_ADMIN_PASSWORD }}
          E2E_MS_SUB_ADMIN_TOTP_SECRET: ${{ secrets.E2E_MS_SUB_ADMIN_TOTP_SECRET }}
          E2E_MS_SUB_PORTAL_USERNAME: ${{ vars.E2E_MS_SUB_PORTAL_USERNAME }}
          E2E_MS_SUB_PORTAL_PASSWORD: ${{ secrets.E2E_MS_SUB_PORTAL_PASSWORD }}
          E2E_MS_SUB_PORTAL_TOTP_SECRET: ${{ secrets.E2E_MS_SUB_PORTAL_TOTP_SECRET }}
          E2E_MS_SUB_SECURITY_USERNAME: ${{ vars.E2E_MS_SUB_SECURITY_USERNAME }}
          E2E_MS_SUB_SECURITY_PASSWORD: ${{ secrets.E2E_MS_SUB_SECURITY_PASSWORD }}
          E2E_MS_SUB_SECURITY_TOTP_SECRET: ${{ secrets.E2E_MS_SUB_SECURITY_TOTP_SECRET }}
          E2E_MS_SUB_LEAD_USERNAME: ${{ vars.E2E_MS_SUB_LEAD_USERNAME }}
          E2E_MS_SUB_LEAD_PASSWORD: ${{ secrets.E2E_MS_SUB_LEAD_PASSWORD }}
          E2E_MS_SUB_LEAD_TOTP_SECRET: ${{ secrets.E2E_MS_SUB_LEAD_TOTP_SECRET }}
          #
          # Cloud Support
          E2E_CLOUD_ADMIN_USERNAME: ${{ vars.E2E_CLOUD_ADMIN_USERNAME }}
          E2E_CLOUD_ADMIN_PASSWORD: ${{ secrets.E2E_CLOUD_ADMIN_PASSWORD }}
          E2E_CLOUD_ADMIN_TOTP_SECRET: ${{ secrets.E2E_CLOUD_ADMIN_TOTP_SECRET }}
          E2E_CLOUD_PORTAL_USERNAME: ${{ vars.E2E_CLOUD_PORTAL_USERNAME }}
          E2E_CLOUD_PORTAL_PASSWORD: ${{ secrets.E2E_CLOUD_PORTAL_PASSWORD }}
          E2E_CLOUD_PORTAL_TOTP_SECRET: ${{ secrets.E2E_CLOUD_PORTAL_TOTP_SECRET }}
          E2E_CLOUD_SECURITY_USERNAME: ${{ vars.E2E_CLOUD_SECURITY_USERNAME }}
          E2E_CLOUD_SECURITY_PASSWORD: ${{ secrets.E2E_CLOUD_SECURITY_PASSWORD }}
          E2E_CLOUD_SECURITY_TOTP_SECRET: ${{ secrets.E2E_CLOUD_SECURITY_TOTP_SECRET }}
          E2E_CLOUD_LEAD_USERNAME: ${{ vars.E2E_CLOUD_LEAD_USERNAME }}
          E2E_CLOUD_LEAD_PASSWORD: ${{ secrets.E2E_CLOUD_LEAD_PASSWORD }}
          E2E_CLOUD_LEAD_TOTP_SECRET: ${{ secrets.E2E_CLOUD_LEAD_TOTP_SECRET }}
        run: pnpm run test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/customer-portal/webapp/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: apps/customer-portal/webapp/test-results/
          retention-days: 7